name: 问题反馈
description: 报告崩溃、卡死、显示错误或规则异常
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量写清楚复现步骤。如果问题能稳定复现，附上截图或录屏会很有帮助。

  - type: input
    id: version
    attributes:
      label: 试玩版本
      placeholder: v0.1 / 2026-10-20
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 系统与分辨率
      placeholder: Windows 11 / 1920×1080
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 选择剑客进入第一章
        2. 在商店购买第二件商品
        3. ……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如果有报错窗口或日志内容，请一并贴出。
    validations:
      required: true

  - type: textarea
    id: save
    attributes:
      label: 存档与触发频率
      description: 是否影响读档？每次都能复现，还是偶尔出现？

  - type: textarea
    id: media
    attributes:
      label: 截图或录屏
      description: 可以直接把图片拖进输入框。
